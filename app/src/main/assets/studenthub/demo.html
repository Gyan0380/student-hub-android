<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudentHub 2.0 Demo</title><style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--a:#2563eb;--line:#e5e7eb}body[data-t=dark]{--bg:#0f1115;--card:#181a20;--text:#e5e7eb;--muted:#9aa0aa;--line:#2a2d34;--a:#3b82f6}body[data-t=sepia]{--bg:#f1e7d0;--card:#fbf3e1;--text:#3a2f22;--muted:#7a6a52;--line:#d8c9a3;--a:#8a4c22}body[data-t=ocean]{--bg:#0a1a2f;--card:#0f2540;--text:#e6f1ff;--muted:#8fb0d0;--line:#1e3a5f;--a:#0e7490}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}header{position:sticky;top:0;z-index:5;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.demo{font-size:11px;padding:6px 9px;border-radius:99px;background:var(--a);color:white}main{max-width:850px;margin:auto;padding:14px 12px 100px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.avatar{width:48px;height:48px;border-radius:50%;overflow:hidden;background:var(--a);color:#fff;display:grid;place-items:center;font-weight:900}.avatar img{width:100%;height:100%;object-fit:cover}.muted{color:var(--muted);font-size:13px}button{border:0;border-radius:10px;padding:9px 12px;background:var(--a);color:white;font-weight:700;cursor:pointer}button.secondary{background:var(--line);color:var(--text)}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px}textarea{min-height:80px}.msg{padding:10px;border:1px solid var(--line);border-radius:13px;margin:7px 0;position:relative}.mine{background:var(--a);color:white}.tag{display:inline-block;padding:3px 7px;border-radius:99px;background:var(--line);font-size:11px;margin:2px}.photo{width:100%;max-width:260px;border-radius:10px;margin-top:6px}.popup{position:fixed;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 35px #0004;padding:5px}.popup button{display:block;width:100%;text-align:left;background:transparent;color:var(--text)}.popup button:hover{background:var(--bg)}.unread{width:9px;height:9px;background:#dc2626;border-radius:50%;display:inline-block}.mention{color:#60a5fa;font-weight:700}.picker{position:absolute;left:0;right:0;bottom:48px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 10px 30px #0003}.hide{display:none}nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:5px;padding:7px;z-index:6}nav button{background:transparent;color:var(--text);font-size:11px}.stat{font-size:24px;font-weight:900}.danger{background:#dc2626}.ok{background:#16a34a}
</style></head><body data-t="dark"><header><div class="brand">🎓 StudentHub <small>v2.0</small></div><span class="demo">DEMO • FIREBASE OFF</span></header><main id="app"></main><nav id="nav"></nav><script>
const S={p:'home',theme:'dark',u:{name:'Aarav Sharma',user:'demo_student',school:'Demo Public School',cls:'Class 9',bio:'Learning • Sharing • Growing 🚀',photo:''},m:{global:[['Riya','Welcome to StudentHub 2.0! 👋'],['Aarav','@Admin please check this.']],anonymous:[['Anonymous Ninja','Good luck for your exams!']],c9:[['Neha','Chapter 3 ka doubt hai 😅'],['Aarav','Send the question!']]},n:[['Welcome','You are using the complete demo.'],['Mention','@demo_student was mentioned.']],sg:[],bg:[],users:[['Aarav Sharma','demo_student','Student'],['Riya Singh','riya_demo','Student'],['Demo Admin','admin_demo','Admin'],['Demo Owner','owner_demo','Owner']]};
const $=x=>document.getElementById(x),E=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function T(x){alert(x)}function go(p){S.p=p;R()}function setT(t){S.theme=t;document.body.dataset.t=t;R()}function nav(){ $('nav').innerHTML=['home','global','c9','notifications','profile'].map(x=>`<button onclick="go('${x}')">${({home:'🏠 Home',global:'💬 Chat',c9:'🎓 Class',notifications:'🔔 Alerts',profile:'👤 Profile'})[x]}</button>`).join('')}
function R(){nav();({home:H,global:()=>C('global','🌍 Global Chat'),anonymous:()=>C('anonymous','🥷 Anonymous Chat'),c9:()=>C('c9','🎓 Class 9 Room'),notifications:NT,profile:PF,rules:RL,suggestions:SG,bugs:BG,admin:AD}[S.p]||H)()}
function H(){let cards=[['🌍','Global Chat','global'],['🥷','Anonymous Chat','anonymous'],['🎓','Class 9 Room','c9'],['🔔','Notifications','notifications'],['📜','Community Rules','rules'],['💡','Suggestion Box','suggestions'],['🐛','Bug Report','bugs'],['🛡️','Full Admin Panel','admin']];$('app').innerHTML=`<div class="card"><div class="row"><div class="avatar">${S.u.photo?`<img src="${S.u.photo}">`:'A'}</div><div class="grow"><h2>Hi, ${E(S.u.name)} 👋</h2><div class="muted">${E(S.u.school)} • ${E(S.u.cls)}</div></div><span class="tag">DEMO</span></div><p class="muted">Firebase is completely OFF. All demo changes stay in this app session.</p></div><div class="grid">${cards.map(x=>`<div class="card"><h3>${x[0]} ${x[1]} ${['global','c9'].includes(x[2])?'<span class="unread"></span>':''}</h3><p class="muted">Full feature preview.</p><button onclick="go('${x[2]}')">Open</button></div>`).join('')}</div>`}
function C(k,title){let a=S.m[k]||[];$('app').innerHTML=`<div class="card"><div class="row"><div class="grow"><h2>${title}</h2><span class="tag">Photo Attachments</span><span class="tag">@Mentions</span><span class="tag">Reply</span><span class="tag">Edit/Delete</span></div><button class="secondary" onclick="go('home')">Back</button></div></div><div class="card">${a.map((x,i)=>`<div class="msg ${x[0]=='Aarav'?'mine':''}" oncontextmenu="CM(event,'${k}',${i})" ontouchstart="LP(event,'${k}',${i})"><b>${E(k==='anonymous'?'Anonymous Ninja':x[0])}</b><div>${E(x[1]).replace(/@([\w.-]+)/g,'<span class="mention">@$1</span>')}</div>${i===0?'<img class="photo" src="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22160%22><rect width=%22300%22 height=%22160%22 fill=%22%236b7280%22/><text x=%22150%22 y=%2285%22 fill=%22white%22 text-anchor=%22middle%22 font-size=%2220%22>Demo Photo</text></svg>">':''}<div class="muted">Just now • Swipe right = Reply • Hold + swipe left = Edit • Long press = menu</div></div>`).join('')}</div><div class="card" style="position:relative"><div id="picker" class="picker hide"></div><textarea id="ct" placeholder="Type @ to mention a member/role..."></textarea><div style="margin-top:8px"><button class="secondary" onclick="photo()">📷 Photo</button> <button onclick="SEND('${k}')">Send</button></div></div>`; mention();}
function mention(){let i=$('ct'),p=$('picker');i.addEventListener('input',()=>{let m=i.value.match(/@([\w.-]*)$/);if(!m){p.classList.add('hide');return}let q=m[1].toLowerCase(),o=[{v:'@Admin',t:'Role'},{v:'@Owner',t:'Role'},{v:'@everyone',t:'Role'},...S.users.map(x=>({v:'@'+x[1],t:'Member'}))].filter(x=>x.v.toLowerCase().slice(1).startsWith(q));p.innerHTML=o.slice(0,8).map(x=>`<button class="secondary" style="width:100%;text-align:left;margin:2px" onclick="pick('${x.v}')">${x.v} <small>${x.t}</small></button>`).join('');p.classList.toggle('hide',!o.length)})}
function pick(v){let i=$('ct');i.value=i.value.replace(/@[\w.-]*$/,v+' ');$('picker').classList.add('hide');i.focus()}
function photo(){T('Demo photo picker opened. Photo attachment is simulated locally; no Firebase upload.')}function SEND(k){let t=$('ct').value.trim();if(!t)return;S.m[k].push(['Aarav',t]);R();T('Message saved locally — Firebase OFF')}function reply(k,i){S.m[k].push(['Aarav','↩️ Replying to: '+S.m[k][i][1]]);R()}function edit(k,i){let n=prompt('Edit your message',S.m[k][i][1]);if(n!==null){S.m[k][i][1]=n;R()}}function del(k,i){if(confirm('Delete message?')){S.m[k].splice(i,1);R()}}function CM(e,k,i){e.preventDefault();menu(e.clientX,e.clientY,k,i)}function LP(e,k,i){clearTimeout(window.__lp);window.__lp=setTimeout(()=>menu(e.touches[0].clientX,e.touches[0].clientY,k,i),650)}function menu(x,y,k,i){document.querySelector('.popup')?.remove();let p=document.createElement('div');p.className='popup';p.style.left=Math.min(x,window.innerWidth-180)+'px';p.style.top=Math.min(y,window.innerHeight-160)+'px';p.innerHTML=`<button onclick="reply('${k}',${i});this.parentNode.remove()">↩️ Reply</button><button onclick="edit('${k}',${i});this.parentNode.remove()">✏️ Edit</button><button onclick="del('${k}',${i});this.parentNode.remove()">🗑️ Delete</button>`;document.body.appendChild(p);setTimeout(()=>document.addEventListener('pointerdown',()=>p.remove(),{once:true}),0)}
function NT(){$('app').innerHTML=`<div class="card"><h2>🔔 Notifications <span class="unread"></span></h2>${S.n.map(x=>`<div class="msg"><b>${E(x[0])}</b><div>${E(x[1])}</div><span class="muted">Demo • unread</span></div>`).join('')}</div>`}function PF(){$('app').innerHTML=`<div class="card"><h2>👤 Profile</h2><div class="row"><div class="avatar">${S.u.photo?`<img src="${S.u.photo}">`:'A'}</div><div><b>${E(S.u.name)}</b><div class="muted">@${E(S.u.user)}</div></div></div><p class="muted">${E(S.u.bio)}</p></div><div class="card"><h3>Edit Profile + Photo Upload</h3><input id="nm" value="${E(S.u.name)}"><br><br><input id="sc" value="${E(S.u.school)}"><br><br><textarea id="bi">${E(S.u.bio)}</textarea><br><br><input id="pf" type="file" accept="image/*"><br><br><button onclick="SAVE()">Save</button></div><div class="card"><h3>🎨 Themes</h3>${[['light','☀️'],['dark','🌙'],['sepia','📜'],['ocean','🌊']].map(x=>`<button class="secondary" onclick="setT('${x[0]}')">${x[1]} ${x[0]}</button> `).join('')}</div>`}function SAVE(){S.u.name=$('nm').value||S.u.name;S.u.school=$('sc').value||S.u.school;S.u.bio=$('bi').value;let f=$('pf').files[0];if(f){let r=new FileReader();r.onload=()=>{S.u.photo=r.result;R()};r.readAsDataURL(f)}else R();T('Profile updated locally')}
function RL(){$('app').innerHTML='<div class="card"><h2>📜 Community Rules</h2><p>1. Respect everyone.</p><p>2. No spam, abuse or unauthorized ads.</p><p>3. Use correct room.</p><p>4. Follow staff instructions.</p></div>'}function SG(){$('app').innerHTML=`<div class="card"><h2>💡 Suggestion Box</h2><textarea id="x"></textarea><br><br><button onclick="BOX('x','sg')">Submit</button></div>`}function BG(){$('app').innerHTML=`<div class="card"><h2>🐛 Bug Report + Screenshot</h2><textarea id="x"></textarea><br><br><input type="file" accept="image/*"><br><br><button onclick="BOX('x','bg')">Submit</button></div>`}function BOX(id,k){let x=$(id).value.trim();if(!x)return T('Write something first');S[k].push(x);T('Saved locally')}
function AD(){$('app').innerHTML=`<div class="card"><h2>🛡️ Full Admin Panel — Demo Preview</h2><div class="grid"><div class="card"><div class="stat">${S.users.length}</div><div class="muted">Users</div></div><div class="card"><div class="stat">${S.m.global.length+S.m.c9.length}</div><div class="muted">Messages</div></div><div class="card"><div class="stat">${S.n.length}</div><div class="muted">Notifications</div></div><div class="card"><div class="stat">${S.bg.length}</div><div class="muted">Reports</div></div></div><div class="grid">${['👥 Manage Users','🛡️ Roles & Permissions','🚫 Ban / Unban','⏱️ Timeout / Remove Timeout','💬 Moderate Messages','📢 Push/Announcement Center','🔔 Notification History','🏷️ Roles/Tags','📜 Community Rules','🤬 Anti-Abuse Words','💡 Suggestions','🐛 Bug Reports','🎓 Class Access','📊 Dashboard & Stats','🔐 Account Controls','⚙️ App Settings'].map(x=>`<div class="card"><b>${x}</b><p class="muted">Demo control • Firebase OFF</p><button class="secondary" onclick="T('Demo action only — nothing is sent online')">Open</button></div>`).join('')}</div></div>`}R();
</script></body></html>
